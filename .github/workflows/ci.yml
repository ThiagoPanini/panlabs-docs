name: CI

# `npm run build` is the only validation. `onBrokenLinks: 'throw'` catches a
# broken link only here: `docusaurus start` returns 200 with the SPA shell
# for any route. `prebuild` regenerates the reference first, exercising the
# contract validator and the command-line model for free.
#
# No new npm dependency enters through this workflow: only `actions/*` and
# `npm ci` against the committed `package-lock.json`.

# Trigger is `push` only. Adding `pull_request` double-reports: a check run
# binds to the SHA, not the event, so the same commit reports twice.
#
# The trigger doesn't narrow to `feature/**` either: a branch outside that
# convention would run no CI, its required check would never report, and its
# PR would stall forever on "waiting for status to be reported". A public
# repo's runner is free; the `feature/` convention is prose, not something a
# machine enforces.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

# An autonomous agent pushes several times in a row; without this, every
# push pays the full run. Only cancels an older SHA on the SAME ref, so the
# PR's HEAD run always completes and the required check never disappears.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the contract with `main`'s ruleset:
  # `required_status_checks.contexts` requires this exact string. It has no
  # `name:` line on purpose, so GitHub reports the id itself as the check
  # name, leaving no display string someone could edit to silently break the
  # ruleset.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (pt-BR e en)
        run: npm run build
