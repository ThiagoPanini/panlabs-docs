name: CI

# A única validação é a que a documentação do Docusaurus já manda rodar:
# `npm run build`. `onBrokenLinks: 'throw'` faz o link quebrado reprovar
# aqui, e só aqui — `docusaurus start` devolve 200 com o shell da SPA para
# qualquer rota.
#
# O `prebuild` regenera a referência a partir do par de contratos de
# assinatura antes do build (`package.json`), e o gerador importa o
# validador do par e o modelo de linha de comando — o build exercita os
# dois de graça, sem passo dedicado.
#
# Nenhuma dependência npm nova entra por esta porta: tudo aqui é `actions/*`
# e `npm ci` sobre o `package-lock.json` versionado.

# O gatilho é `push`, e SÓ `push`. `pull_request` saiu porque duplicava toda
# run: um check run cola no SHA, não no evento, então o mesmo commit reportava
# `Portões e build` duas vezes e a run do push já satisfazia o required check do
# PR.
#
# O gatilho NÃO se estreita para `feature/**`. Uma branch fora da convenção
# passaria a não ter CI, o required check nunca reportaria, e o PR travaria para
# sempre em *"Expected — waiting for status to be reported"*. Runner de repo
# público é grátis; a convenção `feature/` é de prosa, não de máquina.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Em modo autônomo o agente empurra várias vezes seguidas, e sem isto cada push
# paga a bateria inteira. Cancela só SHA mais velho do MESMO ref, então a run do
# HEAD do PR sempre completa e o required check nunca some.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # O id do job é o contrato do ruleset da `main` — é esta string que
  # `required_status_checks.contexts` exige. Ele NÃO tem linha `name:`, e isso é
  # deliberado: sem ela o GitHub reporta o id como nome do check, e não sobra
  # string de exibição que alguém possa editar quebrando o ruleset em silêncio.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (pt-BR e en)
        run: npm run build
