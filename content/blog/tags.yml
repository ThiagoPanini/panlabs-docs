# O catálogo fechado do blog. `onInlineTags: 'throw'`, em docusaurus.config.js,
# faz uma tag que não está aqui falhar o build nomeando o arquivo. Acrescentar
# um assunto é uma entrada nova.
#
# UM EIXO SÓ, E ELE É ASSUNTO. Não há tag de formato de texto: o que se procura
# num acervo técnico é sobre o que o artigo é, não como ele foi escrito. Um
# artigo carrega pelo menos uma tag, conferido em `processBlogPosts`
# (docusaurus.config.js), e pode carregar quantas precisar.
#
# A PRIMEIRA TAG DO FRONT MATTER CARREGA PESO: é ela que vira o chip de acento
# do cartão em destaque, a palavra da placa das linhas e o breadcrumb da página
# do artigo. Reordenar o array muda o que aparece em destaque, e nada avisa.
#
# A ordem aqui é alfabética, e é assim de propósito: não há hierarquia entre
# domínio e produto. Ver DECISIONS.md#the-blog-is-a-tab-not-a-docs-instance.

